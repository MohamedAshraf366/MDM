appId: com.mdm.desktop
productName: MDM - Mohamed Download Manager
copyright: Copyright © 2026 MDM Contributors

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json

extraResources:
  - from: assets
    to: assets
  - from: extension
    to: extension
  - from: tools
    to: tools
    filter:
      - yt-dlp.exe
      - ffmpeg.exe
      - ffprobe.exe

asar: true
compression: normal

# Harden the Electron runtime without breaking the bundled yt-dlp integration.
# youtube.ts launches Electron as Node through ELECTRON_RUN_AS_NODE, so
# runAsNode must stay enabled. The renderer is served over mdm://app
# (src/main/renderer-protocol.ts), so file:// extra privileges stay disabled.
# scripts/verify-fuses.mjs asserts these values on the packaged executable;
# keep the two files in sync.
electronFuses:
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  requestedExecutionLevel: asInvoker
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: https://timestamp.digicert.com

nsis:
  artifactName: MDM-Setup-2.4.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: MDM
  uninstallDisplayName: MDM - Mohamed Download Manager
  deleteAppDataOnUninstall: false
  differentialPackage: true
  include: assets/installer.nsh
